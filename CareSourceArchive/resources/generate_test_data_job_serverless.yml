# CareSource Archive — generate test data (claims, members, providers).
# Dev-only: populates source tables for interactive end-to-end testing.

resources:
  jobs:
    generate_test_data:
      name: caresource-archive-generate-test-data
      parameters:
        - name: catalog
          default: "sandeep_manocha"
        - name: schema
          default: "caresource_data_samples"
      tasks:
        - task_key: generate_data
          notebook_task:
            notebook_path: ../tests/interactive/generate_test_data.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

# CareSource Archive — deploy config Delta tables (Unity Catalog).
# Serverless variant: no job_clusters block, no job_cluster_key on tasks.
# Use for dev/testing — faster startup than job clusters.
# To switch compute: in databricks.yml swap the include between
#   resources/setup_job.yml          (job cluster)
#   resources/setup_job_serverless.yml (serverless)

resources:
  jobs:
    setup_config_tables:
      name: "caresource-archive-setup"
      tasks:
        - task_key: create_tables
          notebook_task:
            notebook_path: ../notebooks/setup_config_tables.py
            base_parameters:
              config_catalog: "${var.config_catalog}"
              config_schema: "${var.config_schema}"

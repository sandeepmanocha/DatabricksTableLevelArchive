# CareSource Archive — ForEach job: generate_parameters → run_archive per table_config.
# ForEach concurrency is controlled by var.archive_foreach_concurrency (set at deploy time).

resources:
  jobs:
    caresource_archive_run:
      name: caresource-archive-run
      job_clusters:
        - job_cluster_key: archive_cluster
          new_cluster:
            spark_version: ${var.job_spark_version}
            node_type_id: ${var.job_node_type_id}
            num_workers: ${var.job_num_workers}
      parameters:
        - name: config_table
          default: ""
        - name: dry_run
          default: "true"
        - name: table_config_filter
          default: ""
        - name: source_catalog
          default: ""
        - name: source_schema
          default: ""
      tasks:
        - task_key: generate_parameters
          job_cluster_key: archive_cluster
          notebook_task:
            notebook_path: ../notebooks/generate_parameters.py
            base_parameters:
              config_table: "{{job.parameters.config_table}}"
              dry_run: "{{job.parameters.dry_run}}"
              table_config_filter: "{{job.parameters.table_config_filter}}"
              source_catalog: "{{job.parameters.source_catalog}}"
              source_schema: "{{job.parameters.source_schema}}"
        - task_key: run_archive
          depends_on:
            - task_key: generate_parameters
          for_each_task:
            concurrency: ${var.archive_foreach_concurrency}
            inputs: "{{tasks.generate_parameters.values.archive_task_inputs}}"
            task:
              task_key: run_archive_iteration
              job_cluster_key: archive_cluster
              notebook_task:
                notebook_path: ../notebooks/run_archive.py
                base_parameters:
                  foreach_payload: "{{input}}"

    # F9.2, JOB-03 — on-demand rehydration; all parameters at runtime (RHY-01).
    caresource_rehydrate:
      name: caresource-archive-rehydrate
      job_clusters:
        - job_cluster_key: rehydrate_cluster
          new_cluster:
            spark_version: ${var.job_spark_version}
            node_type_id: ${var.job_node_type_id}
            num_workers: ${var.job_num_workers}
      parameters:
        - name: config_table
          default: ""
        - name: archive_base_path
          default: ""
        - name: source_table
          default: ""
        - name: target_catalog
          default: ""
        - name: target_schema
          default: ""
        - name: years
          default: ""
      tasks:
        - task_key: run_rehydrate
          job_cluster_key: rehydrate_cluster
          notebook_task:
            notebook_path: ../notebooks/run_rehydrate.py
            base_parameters:
              config_table: "{{job.parameters.config_table}}"
              archive_base_path: "{{job.parameters.archive_base_path}}"
              source_table: "{{job.parameters.source_table}}"
              target_catalog: "{{job.parameters.target_catalog}}"
              target_schema: "{{job.parameters.target_schema}}"
              years: "{{job.parameters.years}}"

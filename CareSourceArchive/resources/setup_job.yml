# CareSource Archive — deploy config Delta tables (Unity Catalog).
# Variables config_catalog, config_schema are defined per target in databricks.yml.
# For qa/stage/prod, run_as is set via target overrides in databricks.yml (var job_run_as_service_principal).

resources:
  jobs:
    setup_config_tables:
      name: "caresource-archive-setup"
      job_clusters:
        - job_cluster_key: setup_cluster
          new_cluster:
            spark_version: ${var.job_spark_version}
            node_type_id: ${var.job_node_type_id}
            num_workers: ${var.job_num_workers}
      tasks:
        - task_key: create_tables
          job_cluster_key: setup_cluster
          notebook_task:
            notebook_path: ../notebooks/setup_config_tables.py
            base_parameters:
              config_catalog: "${var.config_catalog}"
              config_schema: "${var.config_schema}"

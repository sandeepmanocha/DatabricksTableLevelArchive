# CareSource Archive — schema scanner job (F12, SCN-01–SCN-16).
# Serverless variant: no job_clusters block, no job_cluster_key on tasks.
# Use for dev/testing — faster startup than job clusters.
# To switch compute: in databricks.yml swap the include between
#   resources/scanner_job.yml            (job cluster)
#   resources/scanner_job_serverless.yml  (serverless)

resources:
  jobs:
    caresource_scanner:
      name: caresource-archive-scanner
      parameters:
        - name: config_table
          default: ""
        - name: schema_id
          default: ""
        - name: force
          default: "false"
      tasks:
        - task_key: run_scanner
          notebook_task:
            notebook_path: ../notebooks/run_scanner.py
            base_parameters:
              config_table: "{{job.parameters.config_table}}"
              schema_id: "{{job.parameters.schema_id}}"
              force: "{{job.parameters.force}}"

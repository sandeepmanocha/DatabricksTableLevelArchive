# CareSource Archive — schema scanner job (F12, SCN-01–SCN-16).
# Compute-neutral: cluster or serverless is determined per-target in databricks.yml.

resources:
  jobs:
    caresource_scanner:
      name: caresource-archive-scanner
      permissions:
        - user_name: ${var.job_manage_user}
          level: CAN_MANAGE
      parameters:
        - name: config_table
          default: ""
        - name: schema_id
          default: ""
        - name: force
          default: "false"
      tasks:
        - task_key: run_scanner
          notebook_task:
            notebook_path: ../notebooks/run_scanner.py
            base_parameters:
              config_table: "{{job.parameters.config_table}}"
              schema_id: "{{job.parameters.schema_id}}"
              force: "{{job.parameters.force}}"

# CareSource Archive — seed config rows (global_settings + schema_templates).
# Serverless variant: no job_clusters block, no job_cluster_key on tasks.
# Use for dev/testing — faster startup than job clusters.

resources:
  jobs:
    seed_config:
      name: caresource-archive-seed-config
      tasks:
        - task_key: seed_config
          depends_on:
            - task_key: create_tables
          notebook_task:
            notebook_path: ../notebooks/seed_config.py
            base_parameters:
              config_catalog: "${var.config_catalog}"
              config_schema: "${var.config_schema}"
              source_schema: "${var.source_schema}"
        - task_key: create_tables
          notebook_task:
            notebook_path: ../notebooks/setup_config_tables.py
            base_parameters:
              config_catalog: "${var.config_catalog}"
              config_schema: "${var.config_schema}"
